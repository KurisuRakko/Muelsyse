# 主机 Wayland/Selkies 远程桌面的会话身份变量。
#
# 这个目录由 systemd --user 的环境生成器读取（systemd-environment-d-generator），
# 在 user manager 启动时注入 user manager 自己的环境，因此：
#   user manager → dbus.service(dbus-daemon) → D-Bus 激活环境 → 被激活的进程
# 这条链路里的每一个进程都能拿到，kded6 正是被 D-Bus 激活起来的。
#
# 为什么必须有：kded6 的 Kded::initModules() 用 KDE_FULL_SESSION 非空 +
# KDE_SESSION_VERSION == 6 + KDE_SESSION_UID 匹配 来判断"当前是不是 KDE 会话"，
# 判据不成立就跳过所有 X-KDE-Kded-phase>=1 的自动加载模块——其中就有
# statusnotifierwatcher（提供 /StatusNotifierWatcher 对象）。缺了它不会"没有托盘"，
# 而是更坏的半注册状态：kded6 仍然按模块 metadata 抢注 org.kde.StatusNotifierWatcher
# 这个名字，却没有背后的对象，于是所有 SNI 应用报
# "No such object path '/StatusNotifierWatcher'" 且不会回落到 XEmbed 托盘。
#
# 值取自 plasma-workspace/startkde/startplasma.cpp（真机会话里由 startplasma 设置）。
# 本机会话不经过 startplasma，由 scripts/start-wayland-session.sh 负责发布同一份值；
# 这里再兜一层，覆盖"kded6 在 launcher 发布之前就被激活"的启动顺序。
KDE_FULL_SESSION=true
KDE_SESSION_VERSION=6
KDE_SESSION_UID=@UID@
XDG_CURRENT_DESKTOP=KDE
XDG_SESSION_DESKTOP=KDE
XDG_MENU_PREFIX=plasma-
