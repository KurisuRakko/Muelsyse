# 不要让这个服务继承 DISPLAY/XAUTHORITY。
#
# 原因（2026-09-19 定位，有 backtrace 与最小复现）：
# 客户端接入时 Selkies 走 ensure_capture_sink() -> pulsectl_asyncio ->
# libpulse 的 pa_context_new_with_proplist()。进程一旦有可用的 DISPLAY，
# libpulse 就会去读 X11 客户端配置（pa_client_conf_from_x11 -> xcb_disconnect -> free）。
# 而 pcmflux 自带整套 PulseAudio 14 运行库（pcmflux.libs/），它进入全局作用域后
# 会把系统 libxcb 的内部调用截胡（LD_DEBUG=bindings 可见 /lib/.../libxcb.so.1 的
# xcb_connect_to_fd / xcb_disconnect 被解析到 pcmflux.libs/libxcb-*.so）。
# 于是连接由一份 libxcb 创建、被另一份销毁 -> munmap_chunk(): invalid pointer -> SIGABRT。
#
# 最小复现：
#   DISPLAY=:0 + import pcmflux  -> SIGABRT(134)
#   无 DISPLAY  + import pcmflux -> OK
#   DISPLAY=:0 + 不加载 pcmflux  -> OK
# 两个条件缺一不可。
#
# 为什么以前没事：随会话启动的那个 Selkies 早于 launcher 把 DISPLAY 发布进
# systemd user manager，所以没继承到；之后任何一次重启都会继承 DISPLAY=:0，一接入就崩，
# 表现为崩溃循环 + @MUELSYSE_PUBLIC_HOST@ 持续 502。
#
# Selkies 自己不需要 X11：它是 Wayland host capture（WAYLAND_DISPLAY=wayland-remote-desktop）。
[Service]
UnsetEnvironment=DISPLAY XAUTHORITY
