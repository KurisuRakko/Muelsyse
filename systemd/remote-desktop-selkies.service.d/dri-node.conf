# ~/.config/systemd/user/remote-desktop-selkies.service.d/dri-node.conf
# （仓库副本：systemd/remote-desktop-selkies.service.d/dri-node.conf）
# 任务 005 前的文件名是 nvenc-dri.conf；005 改名，007 把方案改成"跟随 KWin 的卡"。
#
# 把 Selkies 的 ExecStart 包一层，用来在每次启动时确定 DRM render 节点
# （消除 renderD128/renderD129 漂移，2026-09-24 那次事故的根因）。
#
# 任务 007 方案：**渲染卡 = 编码卡 = KWin 实际打开的 render 节点**，两种模式都成立：
#   intel 模式（方案 A）-> Intel 节点 -> 同卡零拷贝 VAAPI；
#   nvidia 模式（sudo rakko-gpu-mode nvidia）-> P620 节点 -> 同卡零拷贝 NVENC。
# 包装器读 /proc/<kwin_wayland>/fd 探测节点（有限等待，默认 15s），探测不到才回退到
# 按 PCI 现场解析。原因（代码链）见 scripts/selkies-dri-exec.sh 头部注释：
# KWin 后端只广告/只接受 DMA-BUF，跨卡时 pixelflux 每帧丢弃 → 黑屏。
#
# 在"驱动已装但还没重启"的当下装上也是安全的：包装器探测到 KWin 现在用 Intel
# 就用 Intel，与当前生产行为一致。
#
# 回退（回到完全静态的配置）：
#   rm ~/.config/systemd/user/remote-desktop-selkies.service.d/dri-node.conf
#   systemctl --user daemon-reload && systemctl --user restart remote-desktop-selkies
#   （unit 里已没有 DRI_NODE/DRINODE 行，删掉后由 pixelflux 的 AUTO_GPU 兜底）
#
# 强制节点（调试/应急）：Environment=SELKIES_DRI_NODE=/dev/dri/renderD129
# 调整等待上限（慢机器/冷启动）：Environment=SELKIES_DRI_WAIT=30
#
# 注意：不要动 no-x11-display.conf 那个 drop-in（UnsetEnvironment=DISPLAY XAUTHORITY），
# 少了它 pcmflux 会在客户端接入时 SIGABRT。
#
# 用 `ExecStart=` 空值先清掉 unit 里的原 ExecStart，再重设；这样不必改包/unit 本体。
[Service]
ExecStart=
ExecStart=%h/.local/libexec/selkies-dri-exec.sh %h/.local/libexec/selkies-python3.13 -m selkies
