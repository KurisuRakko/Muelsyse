# ~/.config/systemd/user/remote-desktop-wayland.service.d/upholds-selkies.conf
# （仓库副本：systemd/remote-desktop-wayland.service.d/upholds-selkies.conf）
#
# Selkies 对本单元是 BindsTo=：会话一崩，Selkies 被连带停掉；但会话按 Restart= 自己
# 拉起来之后，BindsTo/WantedBy=default.target 都不会再把 Selkies 启动回来。
# 2026-09-25 开机时会话崩了几次，Selkies 从此停了 4 天，@MUELSYSE_PUBLIC_HOST@ 一直打不开。
# Upholds= 让会话只要在跑，就持续把 Selkies 拉回来。
[Unit]
Upholds=remote-desktop-selkies.service
