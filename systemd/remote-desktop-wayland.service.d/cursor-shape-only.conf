# ~/.config/systemd/user/remote-desktop-wayland.service.d/cursor-shape-only.conf
# （仓库副本：systemd/remote-desktop-wayland.service.d/cursor-shape-only.conf）
#
# 打过补丁的 KWin 录屏插件（kwin/src/plugins/screencast/screencaststream.cpp）在这个
# 变量为 1 时，metadata 光标模式只在光标形状变化时单独录一帧，位置随视频帧的 metadata
# 带上。原行为是指针每动一下就单独 dequeue/queue 一个 buffer：它和紧随其后的窗口重绘
# 抢 KWin 只有 3~4 个的 buffer，拖窗口时 KWin 的真帧大批 dequeue 不到 buffer 被丢掉
# （实测 60Hz 拖动从 14 帧/秒回到 60 帧/秒）。Selkies 用浏览器本地画光标，只要形状。
#
# 只在 KWin 启动时读取：改动后要重启 remote-desktop-wayland（整个 Plasma 会话会重开）。
# 回退：删掉本文件，daemon-reload 后重启 remote-desktop-wayland。
[Service]
Environment=KWIN_SCREENCAST_CURSOR_SHAPE_ONLY=1
