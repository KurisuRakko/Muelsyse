# Sunshine 作为旁路的第二个消费者接入已有的 Selkies KWin Wayland 会话。
# 只覆盖环境与依赖顺序，不改动包自带 unit，也不影响 Selkies 栈。
[Unit]
# 只做顺序与拉活，刻意不用 Requires/BindsTo：
# Sunshine 挂掉不能反过来影响 remote-desktop-wayland/selkies。
After=remote-desktop-wayland.service
Wants=remote-desktop-wayland.service

[Service]
Environment=WAYLAND_DISPLAY=wayland-remote-desktop
Environment=XDG_RUNTIME_DIR=/run/user/@UID@
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/@UID@/bus
Environment=XDG_CURRENT_DESKTOP=KDE
Environment=XDG_SESSION_TYPE=wayland
Environment=XDG_SESSION_DESKTOP=KDE

[Install]
# 包自带的是 WantedBy=graphical-session.target，而这个 headless 会话不拉 graphical-session.target，
# 所以补一个 default.target，enable 后随 user manager 一起起来。
WantedBy=default.target
