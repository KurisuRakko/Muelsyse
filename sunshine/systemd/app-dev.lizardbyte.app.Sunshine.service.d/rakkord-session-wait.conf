# ~/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/rakkord-session-wait.conf
# （仓库源文件：sunshine/systemd/app-dev.lizardbyte.app.Sunshine.service.d/rakkord-session-wait.conf）
#
# 任务 010：Sunshine 开机竞态的有界等待（脚本见仓库 sunshine/libexec/rakkord-sunshine-session-wait.sh）。
#
# 问题（2026-09-25 20:37 那次开机的实测日志）：
#   20:37:58 sunshine 启动
#   20:38:23 [portalgrab] Failed to connect to dbus. Cannot enumerate displays, returning empty list.
#   20:38:25 Fatal: Unable to find display or encoder during startup.
#   —— 之后手动 restart 就能枚举到 Virtual-0。Sunshine 与 KWin / xdg-desktop-portal 抢跑。
#
# 本 drop-in 在包里原有的 `/bin/sleep 5` 和 007 的 nvenc-prep 之后再加一道
# ExecStartPre：最多等 60 秒，直到
#   ① KWin 的 Wayland socket（$XDG_RUNTIME_DIR/wayland-remote-desktop）**能连上**
#      （只判断文件存在不够：KWin 崩溃后 socket 文件会残留，必须 connect 才知道）；
#   ② session bus 可达；
#   ③ xdg-desktop-portal 的 ScreenCast / RemoteDesktop 接口能应答（顺带 D-Bus 激活它）。
# 超时后脚本仍然 exit 0 并打印 warning —— 只改善抢跑，不引入新的失败模式。
# 详见脚本头部注释。
#
# ExecStartPre 的执行顺序 = 包自带 unit + drop-in 按文件名字典序拼接：
#   /bin/sleep 5（包） -> rakkord-nvenc-prep.conf（007） -> rakkord-override.conf -> rakkord-session-wait.conf（本文件）
#
# 调参：Environment=SUNSHINE_SESSION_WAIT=30   # 缩短/延长等待上限（秒）
#       Environment=SUNSHINE_SESSION_WAIT=0    # 关闭等待（只探测一次）
#
# 回退：rm 本文件 && systemctl --user daemon-reload
#       && systemctl --user restart app-dev.lizardbyte.app.Sunshine.service

[Unit]
# session bus 的 socket 必须先起来（dbus.socket 是 user unit；Debian 里是 static）。
After=dbus.socket
Wants=dbus.socket

[Service]
ExecStartPre=%h/.local/libexec/rakkord-sunshine-session-wait.sh
Environment=SUNSHINE_SESSION_WAIT=60
