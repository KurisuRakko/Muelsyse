# ~/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/rakkord-startup-watchdog.conf
# （仓库源文件：sunshine/systemd/app-dev.lizardbyte.app.Sunshine.service.d/rakkord-startup-watchdog.conf）
#
# 2026-10-02：Sunshine 卡在 portal 授权、两天不监听端口却显示 active（详见 rakkord-sunshine-port-wait.sh 头部）。
#
# 1. ExecStartPost 看门狗：90s 内 47990 不监听 → unit 失败 → 包自带 Restart=on-failure 30s 后重来
#    StartLimitIntervalSec=0 取消包自带的 5 次/500s 限速（否则限速后 unit 停在 failed，PartOf 也唤不醒），
#    改用 RestartSec=30 控制节奏：环境真坏时每 ~2 分钟试一次。
# 2. PartOf：portal-kde 或 KWin 会话重启时，Sunshine 跟着重启，重新建 portal 会话。
#    单向：Sunshine 自己挂不会影响它们（仍然不用 Requires/BindsTo）。
#
# 回退：rm 本文件 && systemctl --user daemon-reload
#       && systemctl --user restart app-dev.lizardbyte.app.Sunshine.service

[Unit]
PartOf=plasma-xdg-desktop-portal-kde.service remote-desktop-wayland.service
After=plasma-xdg-desktop-portal-kde.service
StartLimitIntervalSec=0

[Service]
ExecStartPost=%h/.local/libexec/rakkord-sunshine-port-wait.sh
TimeoutStartSec=180
RestartSec=30
