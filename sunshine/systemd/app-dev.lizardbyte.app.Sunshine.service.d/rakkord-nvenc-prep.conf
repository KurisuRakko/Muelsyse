# ~/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/rakkord-nvenc-prep.conf
# （仓库源文件：sunshine/systemd/app-dev.lizardbyte.app.Sunshine.service.d/rakkord-nvenc-prep.conf）
#
# Sunshine 启动前的自愈钩子（见仓库 sunshine/libexec/rakkord-sunshine-nvenc-prep.sh，任务 007 改为模式自适应）：
#   1. adapter_name：按当前模式指向**渲染卡**的 render 节点（防 renderD 编号漂移）：
#        intel 模式 -> Intel 节点；nvidia 模式 -> NVIDIA 节点。
#      （nvenc 不读这个键，但 vaapi 回退时它是唯一选卡依据）；
#   2. encoder：NVIDIA 用户态就绪（/dev/nvidiactl + /dev/nvidia0 + /dev/nvidia-uvm
#      + libcuda.so.1 + libnvidia-encode.so.1）-> nvenc（P620）；
#      否则 vaapi，并打印原因；
#   3. nvidia 模块已加载但设备节点不全时，先用 setuid 的 nvidia-modprobe 补一次。
#
# 两种模式下 Sunshine 的 nvenc 路径不同：
#   intel 模式：display_is_nvidia=false -> PipeWire MemPtr -> cudaMemcpy2D 上传（不需要 nvidia-drm）；
#   nvidia 模式：display_is_nvidia=true -> PipeWire DMA-BUF -> NVENC_GL
#                （cuda.cpp 的 gl_cuda_vram_t，需要 nvidia-drm modeset=1 提供的 card 节点）。
#
# 现在（驱动已装、未重启）装上它是安全的：nvidia 模块还没加载，脚本判定未就绪，
# encoder 保持 vaapi，与当前生产完全一致；重启后自动切 nvenc。
#
# 回退：rm 本文件 && systemctl --user daemon-reload
#       && systemctl --user restart app-dev.lizardbyte.app.Sunshine.service
# 强制：加一行 Environment=SUNSHINE_ENCODER_GPU=vaapi（或 =nvenc）
#       或 Environment=SUNSHINE_ADAPTER_NODE=/dev/dri/renderDxxx
#
# 与包自带 unit / 已有 rakkord-override.conf 的 ExecStartPre 是叠加关系（sleep 5 仍会跑）。
[Service]
ExecStartPre=%h/.local/libexec/rakkord-sunshine-nvenc-prep.sh
