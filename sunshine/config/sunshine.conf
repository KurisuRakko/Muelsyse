# Sunshine (Moonlight host) — RakkoRD 主机模板
# 捕获走 xdg-desktop-portal(KDE) -> KWin screencast，纯 Wayland；
# 不要靠自动探测（顺序里 x11 在 portal 之前，会被误选中）。
capture = portal

# Intel UHD 630 (CometLake-S) 的 VAAPI 硬编，显式指定 render node。
encoder = nvenc
adapter_name = /dev/dri/renderD128

# 允许局域网/内网直连打开 Web UI 做配对；pc = 只允许本机。
origin_web_ui_allowed = lan

# 码率上限(Kbps)：给足，实际值由 Moonlight 客户端决定；0 = 完全不设限。
max_bitrate = 80000

# 音频回环：抓默认 sink "output" 的 monitor（由 pipewire 常驻的 module-null-sink 提供）。
audio_sink = output

# Web UI 的 CSRF 白名单：默认只信任 localhost 变体，
# 从 Tailscale / 局域网 IP 打开 Web UI 会被挡（表现为「blocked by CSRF protection」）。
# 每项必须是含协议的完整前缀；这里显式列出本机的两个入口。
csrf_allowed_origins = https://@RAKKORD_TAILNET_BIND@:47990,https://@RAKKORD_LAN_BIND@:47990

# 强制 H.264：UHD 630 的 iHD 驱动不向 ffmpeg 上报 HEVC 编码能力
# （日志里的 "Driver does not advertise encoder features/block size"），
# ffmpeg 只能用猜测的参数编 HEVC，产出的码流客户端解不开 → Moonlight 黑屏。
# H.264 路径没有这个问题。1 = 不通告 HEVC 支持。
hevc_mode = 1

# Moonlight 会话开始时停掉 Selkies，结束时恢复。
# 目的是避免两个捕获流抢同一个 PipeWire 源和 UHD 630
# （同时开着实测 Selkies 帧率从 22 掉到 4.6），顺带免得忘记关标签页。
# 注意：这不解除 setSoftwareCursorSuppressed，光标问题另算。
# do 失败会中止串流；stop 一个已停止的服务返回 0，所以安全。
global_prep_cmd = [{"do":"@HOME@/.local/libexec/rakkord-sunshine-session-prep do","undo":"@HOME@/.local/libexec/rakkord-sunshine-session-prep undo"}]
